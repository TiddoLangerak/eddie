<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Eddie - Beancount Editor</title>
  <link rel="stylesheet" href="style.css">
  <script type="importmap">
  {
    "imports": {
      "@Tiddo/beancount-types": "./node_modules/@Tiddo/beancount-types/dist/index.js",
      "@Tiddo/beancount-parser": "./node_modules/@Tiddo/beancount-parser/dist/index.js",
      "@Tiddo/beancount-formatter": "./node_modules/@Tiddo/beancount-formatter/dist/index.js"
    }
  }
  </script>
  <script type="module" src="dist/main.js"></script>
</head>
<body>
  <div id="app">
    <h1>Eddie - Beancount Editor</h1>
    <div class="editor-container">
      <textarea id="editor" placeholder="Enter Beancount content here..."></textarea>
      <div class="controls">
        <button id="parse-btn">Parse</button>
        <button id="format-btn">Format</button>
      </div>
      <pre id="output"></pre>
    </div>
  </div>
</body>
</html>
